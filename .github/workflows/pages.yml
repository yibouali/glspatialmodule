name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue the next one instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy web/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Everything in web/ is served as-is: leafmap HTML exports, COGs,
      # GeoJSON. No build step, and no Jekyll, so filenames starting with
      # an underscore survive.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
          name: spatial-module-site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: spatial-module-site
